# ─────────────────────────────────────────────────────────────
# Service d'une application React Router en fichiers statiques.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les noms de fichiers produits par Vite portent une empreinte : leur
    # contenu ne change jamais sous un nom donné, on peut donc les figer.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, lui, n'a pas d'empreinte. Le mettre en cache renverrait
    # un jury sur la version d'avant le dernier déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── Relais vers l'API ────────────────────────────────────────
    # Le front public sert l'API sur SON PROPRE port. Un QR scanné
    # n'ouvre alors qu'une seule adresse, et le téléphone du vérificateur
    # n'a qu'un port à joindre.
    #
    # Sans ce relais, la page se charge (port 5174) puis appelle l'API sur
    # le port 4000 : deux ports à autoriser, et il suffit qu'un pare-feu en
    # laisse passer un seul pour que la page affiche « vérification
    # impossible » sur un diplôme parfaitement valide. C'est exactement ce
    # qui s'est produit en répétition.
    #
    # `api` est le nom du service dans le réseau Docker : la résolution est
    # interne, elle ne dépend d'aucune adresse de la machine hôte.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les fichiers générés (QR, PDF) sont servis par l'API, sous /uploads.
    location /uploads/ {
        proxy_pass http://api:4000/uploads/;
        proxy_set_header Host $host;
    }

    # Toute route inconnue retombe sur l'application : /verifier/DIP-2026-…
    # n'existe pas sur le disque, c'est React Router qui la résout. Sans
    # cette ligne, un QR code scanné donne un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
