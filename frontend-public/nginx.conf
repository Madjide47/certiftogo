# ─────────────────────────────────────────────────────────────
# Service d'une application React Router en fichiers statiques.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les noms de fichiers produits par Vite portent une empreinte : leur
    # contenu ne change jamais sous un nom donné, on peut donc les figer.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, lui, n'a pas d'empreinte. Le mettre en cache renverrait
    # un jury sur la version d'avant le dernier déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Toute route inconnue retombe sur l'application : /verifier/DIP-2026-…
    # n'existe pas sur le disque, c'est React Router qui la résout. Sans
    # cette ligne, un QR code scanné donne un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
