# ─────────────────────────────────────────────────────────────
# Service d'une application React Router en fichiers statiques.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les noms produits par Vite portent une empreinte : contenu figé.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # L'espace privé est une SPA : /ministere/lots n'existe pas sur le
    # disque. Sans ce repli, un rechargement de page donne un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
